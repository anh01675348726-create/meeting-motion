<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="assets/fonts/MiSansVF.min.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1920px; height: 1080px; }
      #c { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="86" data-width="1920" data-height="1080">
      <canvas id="c" class="clip" width="1920" height="1080" data-start="0" data-duration="86" data-track-index="0"></canvas>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="86" data-volume="0.9" data-fade-out="2.5" data-track-index="1"></audio>
    </div>
    <script src="src/timeline.js"></script>
    <script src="src/film.js"></script>
    <script>
      // 一个空补间撑满全片；每次时间变化（播放或拖动）都用当前时间重画一帧
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 86, ease: "none", onUpdate: () => window.frame(tl.time()) });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
      window.frame(0);
    </script>
  </body>
</html>
