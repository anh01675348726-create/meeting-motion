<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>从点，到线，到面，成体系</title>
<link rel="stylesheet" href="../fonts/MiSansVF.min.css">
<style>
html,body{margin:0;height:100%;background:#F4F1EA;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;background:#F4F1EA}
.ctl{position:fixed;left:16px;bottom:10px;font:13px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#8B8C80;display:flex;gap:8px;align-items:center}
.ctl button{font:inherit;color:#1E221C;background:rgba(244,241,234,.8);border:1px solid rgba(30,34,28,.25);border-radius:6px;padding:4px 10px;cursor:pointer}
.ctl input{width:320px}
</style></head>
<body><div class="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div class="ctl"><button id="pp">暂停</button><button id="rs">重播</button><button id="fs">全屏 (F)</button><input id="sk" type="range" min="0" max="88" step="0.1" value="0"><span id="tm"></span></div>
<script>
/* ───────────────── 基础 ───────────────── */
const c=document.getElementById('c'),x=c.getContext('2d');
const FONT='"MiSans VF","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif';
const P='#F4F1EA',INK='#1E221C',MUTE='#8B8C80',BODY='#55574D',GR='#6E7856',GRL='#B3B8A2',OR='#E57A32',OR4='#B4521F',YE='#EDB33B';
const T_END=88;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t;
const win=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const exo=t=>t>=1?1:1-Math.pow(2,-10*t);
const eo3=t=>1-Math.pow(1-t,3);
const sm=t=>t*t*(3-2*t);
const crit=(t,w=8)=>t<=0?0:1-(1+w*t)*Math.exp(-w*t);                 // 临界阻尼：无回弹
const slosh=(t,w=6.8,z=.3)=>{if(t<=0)return 0;const d=Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(w*d*t)+z/d*Math.sin(w*d*t));}; // 唯一带回弹处
let SEED=7;const rnd=()=>(SEED=(SEED*16807)%2147483647)/2147483647;

const paper=document.createElement('canvas');paper.width=1920;paper.height=1080;(()=>{const g=paper.getContext('2d');g.fillStyle=P;g.fillRect(0,0,1920,1080);
  const n=document.createElement('canvas');n.width=480;n.height=270;const ng=n.getContext('2d');const im=ng.createImageData(480,270);
  for(let i=0;i<480*270;i++){const v=215+rnd()*40;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255;}ng.putImageData(im,0,0);
  g.globalCompositeOperation='multiply';g.globalAlpha=.35;g.drawImage(n,0,0,1920,1080);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  g.strokeStyle='rgba(30,34,28,.045)';g.lineWidth=1;for(let i=40;i<1920;i+=40){g.beginPath();g.moveTo(i+.5,0);g.lineTo(i+.5,1080);g.stroke();}for(let i=40;i<1080;i+=40){g.beginPath();g.moveTo(0,i+.5);g.lineTo(1920,i+.5);g.stroke();}})();
const PAT=x.createPattern(paper,'no-repeat');

function T(str,X,Y,o={}){x.save();x.font=`${o.w||400} ${o.s||24}px ${FONT}`;x.fillStyle=o.c||INK;x.textAlign=o.a||'left';x.letterSpacing=(o.ls||0)+'px';x.globalAlpha*=(o.op??1);x.fillText(str,X,Y);x.restore();}
// 文字块：从左往右擦出、从左往右擦掉（不是淡入，也不是飞入）
function block(tIn,tOut,draw,{x0=100,x1=1900,y0=60,y1=1080}={}){const t=NOW;if(t<tIn||t>tOut+.8)return;
  const a=exo(win(t,tIn,tIn+1.1)),b=eio(win(t,tOut,tOut+.7));x.save();x.beginPath();x.rect(lerp(x0,x1,b),y0,(x1-x0)*a-(x1-x0)*b+ (b>0?0:0),y1-y0);x.clip();draw();x.restore();}
function head(eb,h,sub,tIn,tOut){block(tIn,tOut,()=>{T(eb,110,112,{s:22,w:600,c:MUTE,ls:4});T(h,108,186,{s:64,w:650,ls:-1.5});if(sub)T(sub,112,232,{s:24,c:MUTE});},{y1:260});}
function poly(pts,frac=1){const n=Math.max(0,Math.min(pts.length-1,frac*(pts.length-1)));const k=Math.floor(n);if(n<=0)return;x.beginPath();x.moveTo(...pts[0]);
  for(let i=1;i<=k;i++)x.lineTo(...pts[i]);if(k<pts.length-1){const f=n-k;x.lineTo(lerp(pts[k][0],pts[k+1][0],f),lerp(pts[k][1],pts[k+1][1],f));}x.stroke();}
function bez(p0,p1,p2,p3,n=40){const r=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;r.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}return r;}

/* ═════════ 全片 88 秒：序 → 三处断 → 变化 1–4 → 放大 ═════════ */
let NOW=0;
const AY=330,N=40,Y0=430,GAP=9;
const STG=[['员工提出',170],['团队长审核',560],['部门评估',960],['开发',1180],['上线',1400],['推广',1620],['效果',1840]];
const LINES=[...Array(N)].map((_,i)=>{const y=Y0+i*GAP,pass=i<8;
  if(pass){const ty=578+i*6;return {i,pass,y,ty,tail:bez([560,y],[740,y],[760,ty],[960,ty])};}
  const k=i-8,ey=760+k*11,ex=1150+k*14;return {i,pass,y,tail:bez([560,y],[700,y],[760+k*4,ey-80],[ex,ey+60])};});
function eyebrow(s,tIn,tOut){block(tIn,tOut,()=>T(s,110,112,{s:22,w:600,c:OR4,ls:4}),{y1:130});}
function title(h,sub,tIn,tOut){block(tIn,tOut,()=>{T(h,108,186,{s:60,w:650,ls:-1.5});if(sub)T(sub,112,232,{s:23,c:MUTE});},{y0:130,y1:260});}

/* ── 序 + 三处断（0–20） ── */
const FC=50,FR=30,FX=760,FY=330,FG=21;
const DOTS=[...Array(FC*FR)].map((_,n)=>({x:FX+(n%FC)*FG,y:FY+((n/FC)|0)*FG,c:n%FC}));
const ACTIVE=new Set();while(ACTIVE.size<200)ACTIVE.add((rnd()*1500)|0);
const NEEDS=[...Array(800)].map((_,n)=>({x:760+rnd()*1040,y:300+rnd()*660,row:n%40,d:rnd()*2.2}));
function sceneOpen(t){if(t>21)return;
  const zoom=eio(win(t,18.6,20.6));                // 推进「语言断」→ 一根线放大成一道橙色笔触
  x.save();const zx=365,zy=Y0+3*GAP;x.translate(zx,zy);x.scale(1+zoom*16,1+zoom*16);x.translate(-zx,-zy);
  // 工具点阵
  const ta=(1-eio(win(t,5,6.4))*.8)*(1-win(t,9,10.5));x.globalAlpha=1;
  if(ta>0){x.globalAlpha=ta;for(let n=0;n<DOTS.length;n++){const d=DOTS[n];const lit=ACTIVE.has(n)&&t>.3+d.c/FC*2.2;x.fillStyle=lit?INK:'rgba(110,120,86,.38)';x.beginPath();x.arc(d.x,d.y,lit?3.6:2.6,0,7);x.fill();}x.globalAlpha=1;}
  // 需求点 → 线
  const headX=lerp(170,560,eio(win(t,6.6,9.6)));
  if(t>5)for(const n of NEEDS){const show=crit(t-5.1-n.d*.3,7);const go=eio(win(t,6.6+n.d*.9,7.8+n.d*.9));if(go>=1||show<=0)continue;const ty=Y0+n.row*GAP;
    const px=lerp(n.x,headX,go),py=lerp(n.y,ty,go);const sp=Math.sin(Math.PI*go);x.fillStyle=n.row<8?OR:(go>0?GR:INK);x.globalAlpha=show;
    x.beginPath();x.ellipse(px,py,2.6+sp*9,2.4,Math.atan2(ty-n.y,headX-n.x),0,7);x.fill();x.globalAlpha=1;}
  if(t>6.4){
    // 轴
    const ax=eio(win(t,9.4,11));if(ax>0){x.globalAlpha=1-zoom;x.strokeStyle='rgba(30,34,28,.35)';x.lineWidth=1;x.beginPath();x.moveTo(170,AY);x.lineTo(lerp(170,1840,ax),AY);x.stroke();
      STG.forEach(([s,X],i)=>{if(X>lerp(170,1840,ax)+1)return;const on=i<3;x.fillStyle=on?YE:P;x.strokeStyle=INK;x.lineWidth=1.5;x.beginPath();x.arc(X,AY,8,0,7);x.fill();x.stroke();
        T(s,X,AY-30,{s:24,w:on?650:450,a:X>1800?'right':'center',c:on?INK:MUTE});});x.globalAlpha=1;}
    const split=eio(win(t,10.4,13)),rej=eio(win(t,11.2,14));
    for(let k=N-1;k>=0;k--){const L=LINES[k];x.strokeStyle=L.pass?OR:GR;x.lineWidth=L.pass?2.2:1.3;x.globalAlpha=(L.pass?1:.72)*(k===3?1:1-zoom);
      x.beginPath();x.moveTo(170,L.y);x.lineTo(headX,L.y);x.stroke();if(headX>=559){if(L.pass)poly(L.tail,split);else poly(L.tail,rej*.94);}}
    x.globalAlpha=1-zoom;
    const brk=win(t,13,15);if(brk>0)for(let i=0;i<8;i++){const y=578+i*6;for(let X=968;X<1860;X+=14){const f=(X-968)/900;if(f>brk)continue;x.globalAlpha=Math.max(0,1-f)*(1-zoom);x.fillStyle=OR;x.beginPath();x.arc(X,y,1.4*(1-f*.6),0,7);x.fill();}}
    x.globalAlpha=1;
    // 三处断
    [[365,404,'① 语言断','一线说的，一半是问题一半是需求',14.6],[960,520,'② 责任断','评估之后，没人对「做成没有」负责',15.6],[1400,700,'③ 数据断','开发 · 上线 · 效果，没有记录',16.6]].forEach(([X,Y,a,b,t0])=>{const p=exo(win(t,t0,t0+.9));if(p<=0)return;
      x.globalAlpha=p*(1-zoom);x.strokeStyle=OR4;x.lineWidth=1.6;x.beginPath();x.moveTo(X-10,Y-10);x.lineTo(X+10,Y+10);x.moveTo(X+10,Y-10);x.lineTo(X-10,Y+10);x.stroke();
      T(a,X+18,Y-14,{s:22,w:650,c:OR4});T(b,X+18,Y+12,{s:17,c:BODY});x.globalAlpha=1;});
    T('800+',150,412,{s:54,w:250,ls:-2,op:(1-zoom)*win(t,9,10)});T('评审通过 20% · 约 160',980,560,{s:22,w:600,c:OR4,op:(1-zoom)*win(t,12.4,13.2)});
  }
  x.restore();
  eyebrow('现状 · 我们有什么',.2,4.8);title('1500+ 个工具，每天在用的约 13%','日活 200+；背后是 1000+ 名认证数字化专才，人均一个工具。',.3,4.8);
  eyebrow('需求的去向',5.2,18.2);title('800+ 条需求：通过 20%，然后断了三次','需求多是「点状」的；进了流程，汇成 40 根线（一根 = 20 条）。',5.3,18.2);
}

/* ── 变化 1：便签 → 问题卡（20–31） ── */
const CARD={x:110,y:270,w:380,h:470};
const FIELDS=[['普遍痛点','3 个岗位都在手工核对同一类信息'],['发生频率','每人每天多次'],['影响程度','占工时、易出错，返工'],['优化效益','节省工时 → 可折算成本'],['根因（归因后）','两套系统数据不通，靠人搬']];
function sceneCard(t,ox=0){if(t<20.5||t>46)return;x.save();x.translate(ox,0);
                        // 放大的橙色笔触 → 收成便签下划线
  const settle=eio(win(t,23.6,25.4));                    // 便签 → 卡片头部
  const qx=lerp(560,CARD.x+24,settle),qy=lerp(560,CARD.y+120,settle),qs=lerp(54,19,settle);
  if(t>20.5&&t<21.8){const b=eio(win(t,20.5,21.7));x.fillStyle=OR;const h=lerp(38,4,b),yc=lerp(457,qy+qs*.5,b),x0=lerp(0,560,b),x1=lerp(1920,560+qs*15.5,b);x.fillRect(x0,yc-h/2,x1-x0,h);}
  // 卡片框
  const cf=eio(win(t,23.8,25.2));if(cf>0){x.globalAlpha=cf;x.fillStyle='rgba(255,255,255,.55)';x.strokeStyle='rgba(30,34,28,.35)';x.lineWidth=1.2;x.beginPath();x.roundRect(CARD.x,CARD.y,CARD.w,CARD.h,10);x.fill();x.stroke();
    T('问题卡',CARD.x+24,CARD.y+44,{s:26,w:650});T('示意',CARD.x+CARD.w-24,CARD.y+42,{s:16,c:OR4,a:'right',w:600});T('一线原话',CARD.x+24,CARD.y+92,{s:17,c:MUTE,w:600});x.globalAlpha=1;}
  // 原话（便签）
  T('「想要个工具，帮我核对保单信息」',qx,qy,{s:qs,w:settle>.5?450:600,op:exo(win(t,21.2,22))});
  if(t>=21.7&&settle<1){x.strokeStyle=OR;x.lineWidth=lerp(4,0,settle);x.beginPath();x.moveTo(qx,qy+qs*.5);x.lineTo(qx+qs*15.5*(1-settle*.1),qy+qs*.5);x.stroke();}
  if(t>21.6&&t<23.8)T('这是一半问题、一半需求。',560,640,{s:24,c:MUTE,op:exo(win(t,22,22.8))*(1-win(t,23.4,23.8))});
  // 四栏 + 根因：一栏一栏「写」出来
  FIELDS.forEach(([k,v],i)=>{const st=25.4+i*.85;const p=exo(win(t,st,st+.7));if(p<=0)return;const y=CARD.y+164+i*58;
    x.save();x.beginPath();x.rect(CARD.x+20,y-24,(CARD.w-40)*p,60);x.clip();T(k,CARD.x+24,y,{s:17,c:MUTE,w:600});T(v,CARD.x+24,y+26,{s:19,c:i===4?OR4:INK,w:i===4?650:450});x.restore();});
  if(t<31.2){const rp=eio(win(t,25.4,29.6));x.strokeStyle='rgba(30,34,28,.35)';x.lineWidth=1;x.setLineDash([3,6]);x.beginPath();x.moveTo(CARD.x+CARD.w+20,CARD.y+180);x.lineTo(CARD.x+CARD.w+20+380*rp,CARD.y+180);x.stroke();x.setLineDash([]);
    T('前线 A：把「我要个工具」翻译成问题',CARD.x+CARD.w+40,CARD.y+168,{s:22,w:650,op:rp*(1-win(t,30.4,31.2))});
    T('写清普遍性、频率、影响、效益，再追到根因',CARD.x+CARD.w+40,CARD.y+200,{s:18,c:BODY,op:rp*(1-win(t,30.4,31.2))});}
  x.restore();
  eyebrow('变化 1 / 4 · 入口',20.2,30.6);title('从「我要个工具」，到一张问题卡','以前说不清的四件事，现在写在卡上；最后一栏是根因。',20.3,30.6);
}

/* ── 变化 2：四道闸门（31–45） ── */
const GX=560,GW=420,GY=[300,430,560,690];
const Q=['值不值得做？','问题在一个环节内？','流程本身合理，只是衔接断了？','根因在流程 / 规则 / 岗位本身？'];
const Qs=['影响面 × 频率 × 效益；资产库里有没有现成的','只涉及一个岗位 / 一个工具','跨多个环节、多个系统','不改流程，问题会反复出现'];
const OUTS=[['不做','','前线 A + 职能 判定','不投资源','当周出结论 · 写明原因，问题入库等聚类'],['单点优化','· 点','前线 B 牵头，专才改工具','小：一个工具 / 功能','约 2–4 周 · 工具改版 + 回原问题验收'],
  ['全链路优化','· 线','前线 B 牵头，职能协调跨部门','中：多系统 / 多环节打通','约 1–3 个月 · 串联方案 + 数据打通'],['流程重塑','· 面','3+1 提方案，科技副总监拍板','大：流程 / 规则 / 岗位调整','约一个季度 · 新流程 + 制度 + 跨线复制']];
const OX=GX+GW+90;
function sceneGates(t,ox=0){if(t<30.6||t>47)return;x.save();x.translate(ox,0);
  const g=eio(win(t,31,32.4));
  // 主干
  x.strokeStyle=INK;x.lineWidth=1.6;poly(bez([CARD.x+CARD.w,CARD.y+CARD.h/2],[CARD.x+CARD.w+40,CARD.y+CARD.h/2],[GX-40,GY[0]],[GX,GY[0]],24),g);
  if(g>=1){x.beginPath();x.moveTo(GX+14,GY[0]);x.lineTo(GX+14,lerp(GY[0],GY[3],eio(win(t,32.4,33.6))));x.stroke();}
  Q.forEach((q,i)=>{const st=32.6+i*.45;const p=crit(t-st,8);if(p<=0)return;const y=GY[i];x.fillStyle=P;x.strokeStyle=INK;x.lineWidth=1.6;
    x.save();x.translate(GX+14,y);x.rotate(Math.PI/4);x.scale(p,p);x.fillRect(-11,-11,22,22);x.strokeRect(-11,-11,22,22);x.restore();
    T(q,GX+46,y-4,{s:22,w:650,op:p});T(Qs[i],GX+46,y+24,{s:16,c:BODY,op:p});
    // 出口
    const op=exo(win(t,st+.5,st+1.2));if(op<=0)return;x.strokeStyle=i===0?GRL:'rgba(229,122,50,.45)';x.lineWidth=1.6;x.beginPath();x.moveTo(GX+GW-20,y);x.lineTo(GX+GW-20+90*op,y);x.stroke();
    const o=OUTS[i],ix=OX+18;x.globalAlpha=op;
    if(i===0){x.strokeStyle=GRL;x.beginPath();x.arc(ix,y,8,0,7);x.stroke();x.beginPath();x.moveTo(ix-12,y+12);x.lineTo(ix+12,y-12);x.stroke();}
    if(i===1){x.fillStyle=OR;x.beginPath();x.arc(ix,y,10,0,7);x.fill();}
    if(i===2){x.strokeStyle=OR;x.lineWidth=3;x.beginPath();x.moveTo(ix-16,y+8);x.lineTo(ix-4,y-8);x.lineTo(ix+6,y+6);x.lineTo(ix+18,y-6);x.stroke();}
    if(i===3){for(let r=0;r<6;r++){x.strokeStyle=`rgba(214,104,44,${1-r*.13})`;x.lineWidth=1.2;x.beginPath();x.ellipse(ix,y,6+r*3.4,4+r*2.4,0,0,7);x.stroke();}}
    T(o[0],ix+40,y-6,{s:26,w:650,c:i===0?MUTE:INK});if(o[1]){x.font=`650 26px ${FONT}`;T(o[1],ix+40+x.measureText(o[0]).width+8,y-6,{s:22,w:650,c:OR4});}
    T(o[2],ix+40,y+22,{s:17,c:BODY});T(o[3],ix+370,y-8,{s:17,w:600});T(o[4],ix+370,y+18,{s:16,c:BODY});x.globalAlpha=1;});
  // 这张示意卡走哪条路：在第 3 道闸门命中「全链路」
  const run=eio(win(t,36,38.6));if(run>0){const path=[[GX+14,GY[0]],[GX+14,GY[1]],[GX+14,GY[2]],[GX+GW+70,GY[2]],[OX+18,GY[2]]];x.strokeStyle=OR;x.lineWidth=3.4;x.lineCap='round';poly(path,run);x.lineCap='butt';
    if(run>=1){const pul=crit(t-38.6,7);x.strokeStyle=OR;x.lineWidth=1.5;x.beginPath();x.roundRect(OX-10,GY[2]-44,1810-OX+10,88,8);x.globalAlpha=pul;x.stroke();x.globalAlpha=1;
      T('← 这张卡：根因在系统之间，流程本身合理',GX+46,GY[2]+56,{s:17,c:OR4,w:600,op:pul});}}
  block(39.6,44.2,()=>{T('模式创新不是规划出来的，是归因归出来的。',110,900,{s:34,w:650});T('同一根因聚得够多，就从点升级成线、成面——不做的，也留下原因入库。',112,946,{s:21,c:BODY});},{y0:850,y1:970});
  x.restore();
  eyebrow('变化 2 / 4 · 评审',31,44);title('一张问题卡，四道闸门：改多深','每个出口都有拍板人、资源量级、周期和交付物（周期为推测）。',31.1,44);
}

/* ── 变化 3：3+1 接力（45–58） ── */
const SX=[470,700,930,1160,1390,1620],RS=['需求发生','需求评审','开发供给','测试上线','推广验证','总结沉淀'],LY=[380,486,592,698];
const LANE=[['前线 A','问题：听一线、做归因',INK],['前线 B','方案：定方案、盯开发',INK],['前线 C','推广：推下去、看数据',INK],['职能 1 人','资源：业管 · 综管 · 财企',OR4]];
const RSTEP=[{lead:[[0,'溯源一线问题']],help:[]},{lead:[[0,'归因 · 聚类']],help:[[1,'定处置深度'],[3,'审核 · 看资源']]},{lead:[[1,'方案 + 落地计划'],[3,'争取人 · 钱 · 系统']],help:[[2,'选试点']]},

const ROUT=['问题卡','评审结论','方案书 · 排期','验收单','使用周报','资产卡'],RKPI=['频率 · 影响 · 效益','评审周期','按期率','一次通过率','使用率 · 覆盖率','节省工时 · 复用次数'];
const RPATH=(()=>{const pts=[[SX[0]-80,LY[0]]];let prev=pts[0];const nodes=[];RSTEP.forEach((st,i)=>st.lead.forEach(([k])=>{const p=[SX[i],LY[k]];const mx=(prev[0]+p[0])/2;bez(prev,[mx,prev[1]],[mx,p[1]],p,18).slice(1).forEach(q=>pts.push(q));nodes.push({i,k,idx:pts.length-1});prev=p;}));
  bez(prev,[prev[0]+60,prev[1]],[1760,prev[1]],[1800,prev[1]],10).slice(1).forEach(q=>pts.push(q));return {pts,nodes};})();
function sceneRelay(t,ox=0){if(t<44||t>60)return;x.save();x.translate(ox,-eio(win(t,57,59))*640);x.globalAlpha=1-win(t,57.4,59);
  const g=eio(win(t,44.6,46));x.strokeStyle='rgba(30,34,28,.35)';x.lineWidth=1;x.beginPath();x.moveTo(SX[0]-40,300);x.lineTo(lerp(SX[0]-40,SX[5]+120,g),300);x.stroke();
  RS.forEach((s,i)=>{const p=crit(t-44.8-i*.12,9);if(p<=0)return;x.fillStyle=YE;x.strokeStyle=INK;x.lineWidth=1.5;x.beginPath();x.arc(SX[i],300,7*p,0,7);x.fill();x.stroke();T(s,SX[i],282,{s:22,w:650,a:'center',op:p});});
  LANE.forEach(([n,d,col],k)=>{const p=exo(win(t,45+k*.2,46+k*.2));if(p<=0)return;const y=LY[k];x.globalAlpha*=p;x.strokeStyle='rgba(30,34,28,.12)';x.setLineDash([2,6]);x.beginPath();x.moveTo(SX[0]-60,y);x.lineTo(SX[5]+140,y);x.stroke();x.setLineDash([]);
    x.fillStyle=col;x.beginPath();x.arc(126,y-6,7,0,7);x.fill();T(n,142,y,{s:24,w:650,c:col});T(d,142,y+28,{s:17,c:BODY});x.globalAlpha=1-win(t,57.4,59);});
  // 接力：橙线一段段走过每个主责人
  const run=win(t,46.6,55.4);const fr=run;x.strokeStyle=OR;x.lineWidth=3.2;x.lineJoin='round';x.lineCap='round';poly(RPATH.pts,eio(fr));x.lineCap='butt';
  const reached=eio(fr)*(RPATH.pts.length-1);

    const lab=st.lead.find(([k])=>k===nd.k)[1];x.fillStyle=nd.k===3?OR4:OR;x.beginPath();x.arc(SX[nd.i],LY[nd.k],11*p,0,7);x.fill();T(lab,SX[nd.i]+16,LY[nd.k]-14,{s:18,w:650,op:p});
    st.help.forEach(([k,h],j)=>{const q=crit(tt-.2-j*.1,8);if(q<=0)return;x.strokeStyle=k===3?OR4:INK;x.fillStyle=P;x.lineWidth=1.6;x.beginPath();x.arc(SX[nd.i],LY[k],7*q,0,7);x.fill();x.stroke();T(h,SX[nd.i]+14,LY[k]-12,{s:16,c:BODY,op:q});});
    if(nd.k===st.lead[0][0]){const q=exo(win(tt,.3,1));T(ROUT[nd.i],SX[nd.i],870,{s:20,w:600,a:'center',c:OR4,op:q});T(RKPI[nd.i],SX[nd.i],904,{s:16,a:'center',c:BODY,op:q});}});

/* ── 变化 4：沉淀 → 面 → 体（58–78），放大（78–88） ── */
const VM=44,VNX=140,XW=860,ZD=300;
const thick=u=>{const rise=sm(clamp(u/.86));const tail=u>.93?sm((1-u)/.07):1;return (12+230*Math.pow(rise,1.5))*tail;};
const VCOL=j=>{const t=j/(VM-1);const a=[246,206,140],b=[214,104,44];return [lerp(a[0],b[0],t)|0,lerp(a[1],b[1],t)|0,lerp(a[2],b[2],t)|0];};
function project(px,py,pz,cam){const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const x1=px*cy+pz*sy,z1=-px*sy+pz*cy;const y2=py*cp+z1*sp,z2=-py*sp+z1*cp;const s=cam.foc/(cam.dist+z2);return [cam.cx+x1*s*cam.k,cam.cy-y2*s*cam.k,z2];}
function drawVolume(v,cam,{step=1,alpha=1}={}){
  const spread=win(v,1,4.2),unfold=v-4.4,swell=win(v,8,10);const spreadU=lerp(1,0,eio(spread));const rows=[];
  for(let j=0;j<VM;j+=step){const fz=j/(VM-1);const appear=clamp(spread*1.35-(1-fz)*.35);if(appear<=0)continue;const zW=lerp(ZD,-ZD,fz);
    const k=slosh(unfold-.8*(1-fz)-.25*Math.abs(fz-.5),6.8,.3);const pts=[],gnd=[];let depth=0;
    for(let i=0;i<=VNX;i++){const u=i/VNX;if(u<spreadU-.03)continue;const X=lerp(-XW,XW,u);const th=thick(u);
      const yFlat=th*(1-Math.pow(fz,1.25));const zEnv=Math.pow(Math.sin(Math.PI*(fz*.96+.02)),.75);
      const wave=Math.sin(X/170-v*1.05+fz*3.2)*.55+Math.sin(X/310+v*.55-fz*2.1)*.45;const sw=Math.sin(X/120-unfold*4.2+fz*5)*Math.exp(-Math.max(0,unfold-1)*.55)*.22*clamp(unfold);
      const py=lerp(yFlat,th*1.7*zEnv*(1+.14*swell*wave+sw),k),pz=lerp(0,zW,clamp(k));const [sx,sy,sz]=project(X,py,pz,cam);pts.push([sx,sy]);depth+=sz;gnd.push(project(X,0,pz,cam));}
    if(pts.length>1)rows.push({j,fz,appear,pts,gnd,depth:depth/pts.length,k});}
  rows.sort((a,b)=>b.depth-a.depth);
  for(const r of rows){x.save();x.globalAlpha=r.appear*alpha;if(r.k>.02){x.fillStyle=PAT;x.beginPath();r.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));for(let i=r.gnd.length-1;i>=0;i--)x.lineTo(r.gnd[i][0],r.gnd[i][1]);x.closePath();x.fill();}
    x.strokeStyle=`rgb(${VCOL(r.j)})`;x.lineWidth=lerp(1,1.7,r.fz)*cam.k;x.lineJoin='round';x.beginPath();r.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.restore();}}
function sceneVolume(t){const v=t-58;if(v<0)return;
  const up=eio(win(t,78,81.5));                                // 收尾：镜头升高、拉远，体缩成一个「单位」
  const cam={yaw:lerp(0,-.42,eio(win(v,4.6,8.6)))+lerp(0,.16,eio(win(v,8.6,13)))+up*.1,pitch:lerp(lerp(0,.5,eio(win(v,4.6,8.2))),.62,up),foc:1600,dist:lerp(2200,2600,up),cx:lerp(1080,420,up),cy:lerp(760,700,up),k:lerp(1,.4,up)};
  if(v<5){x.save();x.globalAlpha=1-win(v,4,5);for(let i=0;i<8;i++){const p=eio(win(v,0,2.2));const [ex,ey]=project(XW*.86-i*6,thick(.9)*.95,0,{yaw:0,pitch:0,foc:1600,dist:2200,cx:1080,cy:760,k:1});
      x.strokeStyle=OR;x.lineWidth=2.2;x.beginPath();x.moveTo(1800-i*7,-20);x.bezierCurveTo(1800-i*7,300,ex+40,lerp(-20,ey,.7),ex,lerp(-20,ey,p));x.stroke();}x.restore();}
  drawVolume(v,cam);
  // 放大：科技副总监把一条线的体系复制到另两条线
  if(t>81){[[1000,700,'产险线'],[1560,700,'人身险线']].forEach(([cx,cy,n],i)=>{const p=eio(win(t,81.4+i*.5,83+i*.5));if(p<=0)return;
      drawVolume(v,{...cam,cx:lerp(420,cx,p),cy,k:.36},{step:2,alpha:.85*p});T(n,lerp(420,cx,p),cy+120,{s:22,w:650,a:'center',op:p});});
    const p=exo(win(t,81,82));T('客服线（先做成）',420,820,{s:22,w:650,a:'center',op:p});
    x.strokeStyle=OR4;x.lineWidth=1.4;x.setLineDash([3,7]);x.globalAlpha=exo(win(t,82,83));x.beginPath();x.moveTo(600,560);x.bezierCurveTo(700,480,850,480,880,560);x.moveTo(600,540);x.bezierCurveTo(900,420,1300,420,1440,560);x.stroke();x.setLineDash([]);x.globalAlpha=1;}
  eyebrow('变化 4 / 4 · 结果',58.4,77.4);title('做成的方案沉下来，长成体系','效果有数：节省工时 → 财务价值；资产可复用，下一个相似问题不必从头开始。',58.5,77.4);

  block(84,999,()=>{[['入口','「我要个工具」→ 问题卡'],['评审','过 / 不过 → 按根因定深度'],['责任','审批人 → 3+1 责任人'],['结果','看不清 → 有数、可复用']].forEach(([a,b],i)=>{T(a,112+i*440,960,{s:20,w:650,c:OR4});T(b,166+i*440,960,{s:20,c:INK});});},{y0:920,y1:1000});
}
