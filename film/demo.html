<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>议题三 · demo</title>
<link rel="stylesheet" href="../fonts/MiSansVF.min.css">
<style>html,body{margin:0;height:100%;background:#FBF8F0;overflow:hidden}.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block}
.ctl{position:fixed;left:14px;bottom:10px;font:13px -apple-system,"PingFang SC",sans-serif;color:#8B8C80;display:flex;gap:6px;align-items:center}.ctl button{font:inherit;border:1px solid rgba(0,0,0,.2);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}.ctl input{width:260px}.ctl{transition:opacity .5s}.idle #bar,.idle .ctl{opacity:0;pointer-events:none}.ctl input{display:none}
#bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(420px,46vw);height:26px;cursor:pointer;transition:opacity .5s;touch-action:none}
#trk{position:absolute;left:0;right:0;top:12px;height:2px;border-radius:2px;background:rgba(34,48,31,.16)}
#fil{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#56964A,#A8B234,#F6BE2C,#F27026)}
#thumb{position:absolute;top:13px;left:0;transform:translate(-50%,-50%);font:700 11px "MiSans VF","PingFang SC",sans-serif;letter-spacing:1px;color:#FBF8F0;background:#22301F;border-radius:999px;padding:3px 8px 3px 9px;box-shadow:0 1px 3px rgba(0,0,0,.15);white-space:nowrap}
</style></head>
<body><div class="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar"><div id="trk"><div id="fil"></div></div><div id="thumb">专业</div></div>
<div class="ctl"><button id="pp">暂停</button><button id="rs">重播</button><button id="fs">全屏 (F)</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const FONT='"MiSans VF","PingFang SC",sans-serif';
/* ── 明亮版 橙黄橘绿：叶青 → 橘绿 → 柑黄 → 橙 ── */
const INK='#22301F',MUTE='#8A8C7A',PAPER='#FBF8F0';
const STOPS=[[86,150,74],[168,178,52],[246,190,44],[242,112,38]];
const rip=t=>{t=Math.max(0,Math.min(1,t))*3;const i=Math.min(2,Math.floor(t)),f=t-i,a=STOPS[i],b=STOPS[i+1];return a.map((v,k)=>v+(b[k]-v)*f);};
const rgb=(a,al=1)=>`rgba(${a.map(Math.round)},${al})`;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,win=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,exo=t=>t>=1?1:1-Math.pow(2,-10*t);
const sp=(t,w=7)=>t<=0?0:1-(1+w*t)*Math.exp(-w*t);
const bounce=(t,w=7.5,z=.38)=>{if(t<=0)return 0;const d=Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(w*d*t)+z/d*Math.sin(w*d*t));};
let sd=11;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
const paper=document.createElement('canvas');paper.width=1920;paper.height=1080;(()=>{const g=paper.getContext('2d');g.fillStyle=PAPER;g.fillRect(0,0,1920,1080);
  const n=document.createElement('canvas');n.width=640;n.height=360;const ng=n.getContext('2d');const im=ng.createImageData(640,360);for(let i=0;i<640*360;i++){const v=232+R()*23;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255;}ng.putImageData(im,0,0);
  g.globalCompositeOperation='multiply';g.globalAlpha=.12;g.drawImage(n,0,0,1920,1080);})();
function T(s,X,Y,o={}){x.save();x.font=`${o.w||400} ${o.s||20}px ${FONT}`;x.fillStyle=o.c||INK;x.textAlign=o.a||'left';x.globalAlpha=o.op??1;x.letterSpacing=(o.ls||0)+'px';x.fillText(s,X,Y);x.restore();}
function W(s,X,Y,o,p){if(p<=0)return;x.save();x.font=`${o.w||400} ${o.s||20}px ${FONT}`;const w=x.measureText(s).width;const a=o.a==='right'?X-w:o.a==='center'?X-w/2:X;x.beginPath();x.rect(a-4,Y-o.s*1.15,(w+8)*eio(p),o.s*1.6);x.clip();T(s,X,Y,o);x.restore();}
const hair=(pts,al=.45,w=1,dash)=>{x.save();x.strokeStyle=`rgba(34,48,31,${al})`;x.lineWidth=w;if(dash)x.setLineDash(dash);x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.restore();};

/* ═════ 40 根线，每根 = 20 条需求；每根线的数据属性（示意）═════ */
const N=40,M=64;
const D=[...Array(N)].map((_,i)=>{const src=i<16?0:i<28?1:2;           // 来源：前线 16 · 经营 12 · 巡检 12（示意）
  const layer=[0,0,1,3,1,2,0,3,1,0][i%10];                                   // 根因所在层：操作 / 流程 / 规则 / 分工
  const tier=layer===0?0:layer===3?2:1;                                      // 处理：点 / 线 / 面
  return {i,src,layer,tier,size:.5+R(),gx:i%8,gy:(i/8)|0,ang:R()*6.283,dx:R(),dy:R(),seed:R()*10};});
/* 每个状态：给出第 i 根线的 M 个点 + 颜色成熟度 + 线宽 */
const CX=960,CY=610;
const ST=[
 // 0 · 点：一格一格的墨点（大小 = 这一格里的工具数，示意）
 d=>{const X=640+d.gx*160+(d.gy%2)*40,Y=300+d.gy*150;const r=8+d.size*10;return {pts:circ(X,Y,r*.15),w:r,c:.02};},
 // 1 · 点状需求：散开成短划，方向各异
 d=>{const X=520+d.dx*1300,Y=280+d.dy*700,L=40+d.size*50;return {pts:seg(X-Math.cos(d.ang)*L/2,Y-Math.sin(d.ang)*L/2,X+Math.cos(d.ang)*L/2,Y+Math.sin(d.ang)*L/2),w:3,c:.05};},
 // 2 · 三条来源汇成一束（米纳德）
 d=>{const ys=[290,580,870][d.src],k=d.i-(d.src===0?0:d.src===1?16:28),cnt=d.src===0?16:12,o=(k-(cnt-1)/2)*10;const ty=CY+(d.i-19.5)*4.4;
   return {pts:bz([110,ys+o],[700,ys+o],[860,ty],[1300,ty]).concat(seg(1300,ty,1820,ty).slice(1)),w:2,c:.22};},
 // 3 · 四层诊断：线变成射线，长度 = 根因所在的深度
 d=>{const a=-Math.PI/2+d.i/N*Math.PI*2,r0=60,r1=[170,270,370,470][d.layer]+d.size*18;return {pts:seg(CX+Math.cos(a)*r0,CY+Math.sin(a)*r0*.92,CX+Math.cos(a)*r1,CY+Math.sin(a)*r1*.92),w:2.2,c:.32+d.layer*.08};},
 // 4 · 三级处理：点（收成一粒）· 线（串成链）· 面（一圈圈等高线）
 d=>{if(d.tier===0){const k=D.filter(e=>e.tier===0).indexOf(d);const X=200+(k%5)*70,Y=520+((k/5)|0)*80;return {pts:circ(X,Y,2),w:14+d.size*8,c:.5};}
   if(d.tier===1){const k=D.filter(e=>e.tier===1).indexOf(d);const Y=470+k*24;return {pts:wave(700,Y,1260,Y,k),w:2.6,c:.72};}
   const k=D.filter(e=>e.tier===2).indexOf(d);const r=30+k*22;return {pts:blob(1580,680,r*1.3,r*.86,k),w:2,c:.86+k*.016};},
 // 5 · 流程：全部汇成一条编织的长带，沿流程越往右越熟
 d=>{const o=(d.i-19.5)*8;return {pts:[...Array(M)].map((_,j)=>{const t=j/(M-1),X=110+t*1700;return [X,CY+o*(1-.55*Math.sin(Math.PI*t))+Math.sin(t*9+d.i*.7)*3*(1-t)];}),w:1.5,c:-1};},
];
function seg(a,b,c2,d2){return [...Array(M)].map((_,j)=>{const t=j/(M-1);return [lerp(a,c2,t),lerp(b,d2,t)];});}
function circ(X,Y,r){return [...Array(M)].map((_,j)=>{const t=j/(M-1)*6.283;return [X+Math.cos(t)*r,Y+Math.sin(t)*r];});}
function bz(p0,p1,p2,p3){const n=M/2;return [...Array(n)].map((_,j)=>{const t=j/(n-1),u=1-t;return [u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]];});}
function wave(a,b,c2,d2,k){return [...Array(M)].map((_,j)=>{const t=j/(M-1);return [lerp(a,c2,t),lerp(b,d2,t)+Math.sin(t*12+k)*5];});}
function blob(X,Y,rx,ry,k){return [...Array(M)].map((_,j)=>{const t=j/(M-1)*6.283;const w=1+.1*Math.sin(t*3+k*.6)+.05*Math.sin(t*5-k);return [X+Math.cos(t)*rx*w,Y+Math.sin(t)*ry*w];});}

/* 状态时间表：每次形变按线的序号错峰（像一阵风吹过），用弹簧落定 */
const KT=[0,2.6,5.0,8.0,11.0,14.0];
/* ═════ 真正的形变：每个状态先按弧长重采样成同样 48 个点并缓存，
   形变 = 同一根线上的每个点，从上一形状的对应点连续滑到下一形状的对应点 ═════ */
const MP=48;
function resample(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=L[L.length-1]||1,out=new Float32Array(MP*2);let j=0;
  for(let i=0;i<MP;i++){const s=tot*i/(MP-1);while(j<L.length-2&&L[j+1]<s)j++;const f=Math.min(1,(s-L[j])/((L[j+1]-L[j])||1));
    out[i*2]=pts[j][0]+(pts[j+1][0]-pts[j][0])*f;out[i*2+1]=pts[j][1]+(pts[j+1][1]-pts[j][1])*f;}return out;}
const CACHE=ST.map(fn=>D.map(d=>{const S=fn(d);return {p:resample(S.pts),w:S.w,c:S.c};}));
// 弹簧：轻微过冲（约 8%）后落定 —— 弹跳感
const spring=(t,w=6.5,z=.62)=>{if(t<=0)return 0;const q=Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(w*q*t)+z/q*Math.sin(w*q*t));};
const BUF=D.map(()=>new Float32Array(MP*2)),LX=new Float32Array(MP*2),RX=new Float32Array(MP*2);
function shapeAt(d,t){let s=0;while(s<KT.length-1&&t>=KT[s+1])s++;const B=CACHE[s][d.i],out=BUF[d.i];
  if(s===0){out.set(B.p);}else{const A=CACHE[s-1][d.i],t0=t-KT[s]-(d.i/N)*.45;
    const side=Math.sin(d.seed*6.1)*36;
    for(let j=0;j<MP;j++){const k=spring(t0-j/MP*.22);          // 线头先走、线尾跟上：像液体被拉过去
      const arc=Math.sin(Math.PI*Math.min(1,Math.max(0,k)))*side;   // 途中走一段弧，不是直线平移
      out[j*2]=A.p[j*2]+(B.p[j*2]-A.p[j*2])*k;out[j*2+1]=A.p[j*2+1]+(B.p[j*2+1]-A.p[j*2+1])*k+arc;}}
  const k=s===0?1:Math.min(1,Math.max(0,spring(t-KT[s]-(d.i/N)*.45)));const A=s===0?B:CACHE[s-1][d.i];
  // 落定后：沿线传播的细小波 —— 一直在流
  const amp=(B.w>8?.8:2.2)*Math.min(1,k);for(let j=0;j<MP;j++)out[j*2+1]+=Math.sin(j*.3-t*2.4+d.seed)*amp;
  const kw=B.w<A.w?Math.min(1,k*2.2):k;return {p:out,w:A.w+(B.w-A.w)*kw,c:B.c<0?-1:(A.c<0?.5:A.c)+(B.c-(A.c<0?.5:A.c))*k};}
let GRAD=null;
function drawLine(d,S){const p=S.p;
  // 笔触：沿法线两侧偏移，围成一个两头收尖的形状，一次填充（快，而且有笔压）
  for(let j=0;j<MP;j++){const a=Math.max(0,j-1),b=Math.min(MP-1,j+1);let nx=-(p[b*2+1]-p[a*2+1]),ny=p[b*2]-p[a*2];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
    const t=j/(MP-1),hw=S.w*(.5+.5*Math.sin(Math.PI*t))*.5+.35;LX[j*2]=p[j*2]+nx*hw;LX[j*2+1]=p[j*2+1]+ny*hw;RX[j*2]=p[j*2]-nx*hw;RX[j*2+1]=p[j*2+1]-ny*hw;}
  x.beginPath();x.moveTo(LX[0],LX[1]);for(let j=1;j<MP;j++)x.lineTo(LX[j*2],LX[j*2+1]);for(let j=MP-1;j>=0;j--)x.lineTo(RX[j*2],RX[j*2+1]);x.closePath();
  if(S.c<0){if(!GRAD){GRAD=x.createLinearGradient(110,0,1810,0);STOPS.forEach((s,i)=>GRAD.addColorStop(i/3,rgb(s)));}x.fillStyle=GRAD;}else x.fillStyle=rgb(rip(S.c),.95);
  x.fill();}
function beads(d,S,t){if(S.w>8)return;const p=S.p;const dx=p[(MP-1)*2]-p[0],dy=p[(MP-1)*2+1]-p[1];if(dx*dx+dy*dy<300*300)return;
  const u=(t*.3+d.seed*.1)%1,j=Math.floor(u*(MP-2));const a=Math.atan2(p[j*2+3]-p[j*2+1],p[j*2+2]-p[j*2]);
  x.fillStyle=rgb((S.c<0?rip(u):rip(S.c)).map(v=>v*.8));x.beginPath();x.ellipse(p[j*2],p[j*2+1],S.w*2+3,S.w*.9+1.2,a,0,7);x.fill();}

/* ═════ 编辑排版层：每个状态都有自己的注记、刻度和图例 ═════ */
function legend(t,a,b){const p=win(t,a,a+.8)*(1-win(t,b,b+.5));if(p<=0)return;x.save();x.globalAlpha=p;const X=1560,Y=830;
  hair([[X,Y-34],[X+250,Y-34]],.3);T('读图方法',X,Y-44,{s:15,w:650,c:MUTE,ls:2});
  x.strokeStyle=rgb(rip(.1));x.lineWidth=2;x.beginPath();x.moveTo(X,Y);x.lineTo(X+40,Y);x.stroke();T('一根线 = 20 条需求（示意）',X+52,Y+5,{s:15});
  for(let i=0;i<4;i++){x.fillStyle=rgb(STOPS[i]);x.fillRect(X+i*12,Y+24,10,10);}T('颜色 = 成熟度：青 → 橙',X+52,Y+35,{s:15});
  hair([[X,Y+60],[X+40,Y+60]],.8,1);hair([[X,Y+54],[X,Y+66]],.8);hair([[X+40,Y+54],[X+40,Y+66]],.8);T('长度 = 根因深度',X+52,Y+65,{s:15});x.restore();}
function overlay(t){
  T('议题三 · 需求管理全流程',110,92,{s:20,w:650,c:'#C77A1E',ls:4});
  const H=[['1700+ 个工具，一格一格的点',.1,2.4],['需求也是一个个点：方向各异',2.7,4.8],['进了流程，汇成一束线',5.1,7.8],['先找根因：往下钻四层',8.1,10.8],['按深度处理：点 · 线 · 面',11.1,13.8],['最后汇成一条流程，越往后越熟',14.1,99]];
  H.forEach(([s,a,b])=>{const p=win(t,a,a+1),q=win(t,b,b+.4);if(p>0&&q<1){x.save();x.globalAlpha=1-q;W(s,108,156,{s:46,w:650,ls:-1},p);x.restore();}});
  // 0 · 点阵的格线与行列号
  const g=win(t,.3,1.2)*(1-win(t,2.4,3));if(g>0){x.save();x.globalAlpha=g;for(let r=0;r<5;r++){hair([[600,300+r*150],[1860,300+r*150]],.12);T(String.fromCharCode(65+r),572,306+r*150,{s:14,c:MUTE});}
    for(let k=0;k<8;k++)T(String(k+1).padStart(2,'0'),660+k*160,262,{s:14,c:MUTE,a:'center'});
    T('点越大，这一格的工具越多',110,820,{s:18,c:MUTE});T('1000+ 专才 · 1700+ 工具',110,860,{s:30,w:650});T('彼此不相连',112,894,{s:18,c:MUTE});x.restore();}
  // 1 · 短划的方向标注
  const h=win(t,3.3,4)*(1-win(t,4.8,5.2));if(h>0){x.save();x.globalAlpha=h;T('一线员工提的，多是「点状」需求：',110,820,{s:22,w:650});T('说不清普遍痛点、发生频率、影响程度、优化效益',110,856,{s:18,c:MUTE});
    const d=D[7];const X=700+d.dx*1050,Y=300+d.dy*600;hair([[X,Y],[X+80,Y-70],[X+220,Y-70]],.5);T('「希望自动整理报表」',X+86,Y-80,{s:16});x.restore();}
  // 2 · 三条来源标签 + 计数
  const m=win(t,5.8,6.6)*(1-win(t,7.8,8.2));if(m>0){x.save();x.globalAlpha=m;[[300,'前线提报','16 根'],[560,'经营识别','12 根'],[820,'专家巡检','12 根']].forEach(([y,n,cnt],k)=>{T(n,170,y-60,{s:22,w:650,c:rgb(rip(.1))});T(cnt,170+n.length*22+10,y-60,{s:15,c:MUTE});});
    hair([[1300,CY-150],[1300,CY+150]],.6);T('问题清单',1316,CY-130,{s:22,w:650});T('统一字段 · 分公司按月汇总',1316,CY-104,{s:15,c:MUTE});x.restore();}
  // 3 · 四层同心圆 + 刻度
  const r=win(t,8.2,9.2)*(1-win(t,10.8,11.2));if(r>0){x.save();x.globalAlpha=r;['操作环节','业务流程','业务规则','生产分工'].forEach((n,k)=>{const rr=[150,230,310,390][k];x.strokeStyle=`rgba(34,48,31,${.16+k*.04})`;x.setLineDash([2,5]);x.lineWidth=1;x.beginPath();x.ellipse(CX,CY,rr*eio(r),rr*.92*eio(r),0,0,7);x.stroke();x.setLineDash([]);
      const a=-.62,lx=CX+Math.cos(a)*rr,ly=CY+Math.sin(a)*rr*.92;x.fillStyle=INK;x.beginPath();x.arc(lx,ly,3,0,7);x.fill();hair([[lx,ly],[1500,ly]],.25);T(n,1510,ly+5,{s:20,w:650});T(['重复、复杂、高耗时？','衔接不顺、反复审核？','标准不统一、规则过多？','分工不合理、人工做标准任务？'][k],1600,ly+5,{s:14,c:MUTE});});
    T('不是每个问题都要走完四层，也不是层次越高越好',110,860,{s:18,c:MUTE});x.restore();}
  // 4 · 三级处理的标题和参数
  const o=win(t,11.6,12.4)*(1-win(t,13.8,14.2));if(o>0){x.save();x.globalAlpha=o;
    [[200,'一般操作问题 · 点','数字化专才快速处理','1–2 周上线',.5],[700,'复杂流程问题 · 线','解决方案专家牵头','2–4 周见效',.72],[1400,'重大业务问题 · 面','公司统筹，专项改造','1–3 个月推进',.95]].forEach(([X,a,b,cc,ci])=>{T(a,X,380,{s:28,w:650,c:INK});T(b,X,410,{s:18,c:MUTE});T(cc,X,438,{s:18,w:650,c:rgb(rip(ci))});});
    // 小柱：每一级各有几根线（真实来自上面的数据）
    [0,1,2].forEach(k=>{const n=D.filter(d=>d.tier===k).length;for(let i=0;i<n;i++){x.fillStyle=rgb(rip([.5,.72,.95][k]));x.fillRect(200+k*90,1000-i*8,64,6);}T(['点','线','面'][k]+' '+n,200+k*90,1026,{s:14,c:MUTE});});
    x.restore();}
