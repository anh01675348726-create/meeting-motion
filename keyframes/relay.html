<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>3+1 接力 · 关键帧</title>
<link rel="stylesheet" href="../fonts/MiSansVF.min.css">
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#F4F1EA}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
(async()=>{
await document.fonts.ready;
const c=document.getElementById('c'),x=c.getContext('2d');
const P='#F4F1EA',INK='#1E221C',MUTE='#8B8C80',BODY='#55574D',GR='#6E7856',OR='#E57A32',OR4='#B4521F',YE='#EDB33B';
const FONT='"MiSans VF","PingFang SC",sans-serif';
function T(s,X,Y,o={}){x.save();x.font=`${o.w||400} ${o.s||20}px ${FONT}`;x.fillStyle=o.c||INK;x.textAlign=o.a||'left';x.letterSpacing=(o.ls||0)+'px';x.fillText(s,X,Y);x.restore();}
let sd=3;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
x.fillStyle=P;x.fillRect(0,0,1920,1080);
const n=document.createElement('canvas');n.width=480;n.height=270;const ng=n.getContext('2d');const im=ng.createImageData(480,270);for(let i=0;i<480*270;i++){const v=215+R()*40;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255;}ng.putImageData(im,0,0);
x.save();x.globalCompositeOperation='multiply';x.globalAlpha=.18;x.drawImage(n,0,0,1920,1080);x.restore();
x.strokeStyle='rgba(30,34,28,.045)';for(let i=40;i<1920;i+=40){x.beginPath();x.moveTo(i+.5,0);x.lineTo(i+.5,1080);x.stroke();}for(let i=40;i<1080;i+=40){x.beginPath();x.moveTo(0,i+.5);x.lineTo(1920,i+.5);x.stroke();}

T('变化 1 · 从审批人，到责任人',110,92,{s:22,w:600,c:MUTE,ls:3});
T('3 + 1 组队之后：一条需求，每一步是谁在推？',108,160,{s:54,w:650,ls:-1});
T('一根橙线 = 一条需求，从谁手里经过；实心点 = 这一步的主责人，空心点 = 协同。分工为推演，供讨论。',112,202,{s:21,c:MUTE});

const SX=[470,700,930,1160,1390,1620],STG=['需求发生','需求评审','开发供给','测试上线','推广验证','总结沉淀'];
const LY=[370,476,582,688];
const LANE=[['前线 A','问题：听一线、做归因',INK],['前线 B','方案：定方案、盯开发',INK],['前线 C','推广：推下去、看数据',INK],['职能 1 人','资源：业管 · 综管 · 财企',OR4]];
// 列头
x.strokeStyle='rgba(30,34,28,.35)';x.lineWidth=1;x.beginPath();x.moveTo(SX[0]-40,300);x.lineTo(SX[5]+120,300);x.stroke();
STG.forEach((s,i)=>{x.fillStyle=YE;x.strokeStyle=INK;x.lineWidth=1.5;x.beginPath();x.arc(SX[i],300,7,0,7);x.fill();x.stroke();T(`0${i+1}`,SX[i],252,{s:16,c:MUTE,a:'center'});T(s,SX[i],282,{s:22,w:650,a:'center'});});
// 泳道
LANE.forEach(([n,d,col],k)=>{const y=LY[k];x.strokeStyle='rgba(30,34,28,.12)';x.setLineDash([2,6]);x.beginPath();x.moveTo(SX[0]-60,y);x.lineTo(SX[5]+140,y);x.stroke();x.setLineDash([]);
  x.fillStyle=col;x.beginPath();x.arc(126,y-6,7,0,7);x.fill();T(n,142,y,{s:24,w:650,c:col});T(d,142,y+28,{s:17,c:BODY});});
// 每一步：主责（实心）+ 协同（空心）+ 动作短句
const S=[
  {lead:[[0,'溯源一线问题']],help:[]},
  {lead:[[0,'归因 · 聚类']],help:[[1,'定处置深度'],[3,'审核 · 看资源']]},
  {lead:[[1,'方案 + 落地计划'],[3,'争取人 · 钱 · 系统']],help:[[2,'选试点']]},
  {lead:[[1,'组织业务验收']],help:[[0,'回原问题验证'],[2,'备培训'],[3,'配套制度流程']]},
  {lead:[[2,'培训推广 · 跟数据']],help:[[0,'收集反馈'],[3,'纳入考核机制']]},
  {lead:[[2,'效果复盘']],help:[[1,'资产入库'],[3,'跨线复制'],[0,'新问题回流']]},
];
// 需求线：穿过每一步的主责点（接力）
const path=[];S.forEach((st,i)=>{st.lead.forEach(([k])=>path.push([SX[i],LY[k]]));});
x.strokeStyle=OR;x.lineWidth=3.2;x.lineJoin='round';x.lineCap='round';x.beginPath();x.moveTo(SX[0]-60,LY[0]);
path.forEach(([px,py],i)=>{const [qx,qy]=i?path[i-1]:[SX[0]-60,LY[0]];const mx=(qx+px)/2;x.bezierCurveTo(mx,qy,mx,py,px,py);});x.lineTo(SX[5]+120,path[path.length-1][1]);x.stroke();
// 回流：沉淀 → 需求发生（虚线，从下方绕回）
x.setLineDash([3,8]);x.lineWidth=1.6;x.beginPath();x.moveTo(SX[5]+120,LY[2]);x.bezierCurveTo(SX[5]+200,LY[2],SX[5]+200,780,SX[5],780);x.lineTo(SX[0],780);x.bezierCurveTo(SX[0]-120,780,SX[0]-120,LY[0],SX[0]-60,LY[0]);x.stroke();x.setLineDash([]);
T('沉淀的资产 → 回流需求端：下一个相似问题提得更准',SX[2],808,{s:18,c:OR4,w:500});
S.forEach((st,i)=>{st.help.forEach(([k,t])=>{x.strokeStyle=k===3?OR4:INK;x.fillStyle=P;x.lineWidth=1.6;x.beginPath();x.arc(SX[i],LY[k],7,0,7);x.fill();x.stroke();T(t,SX[i]+14,LY[k]-12,{s:16,c:BODY});});
  st.lead.forEach(([k,t])=>{x.fillStyle=k===3?OR4:OR;x.beginPath();x.arc(SX[i],LY[k],11,0,7);x.fill();T(t,SX[i]+16,LY[k]-14,{s:18,w:650,c:INK});});});
// 底部两行：交付物 / 看什么数
const OUT=['问题卡','评审结论','方案书 · 排期','验收单','使用周报','资产卡'];
const KPI=['频率 · 影响 · 效益','评审周期 · 不做也留原因','按期率','一次通过率','使用率 · 覆盖率','节省工时 · 复用次数'];
x.strokeStyle='rgba(30,34,28,.3)';x.beginPath();x.moveTo(110,850);x.lineTo(1810,850);x.stroke();
T('交付物',110,892,{s:22,w:650});T('看什么数',110,948,{s:22,w:650});
SX.forEach((sx,i)=>{T(OUT[i],sx,892,{s:20,w:600,a:'center',c:OR4});T(KPI[i],sx,948,{s:16,a:'center',c:BODY});});
T('以前：评估之后无人负责，开发 · 上线 · 推广 · 效果都看不清。',110,1010,{s:20,c:MUTE});
T('现在：每一步都有主责人、有交付物、有数。',1060,1010,{s:22,w:650,c:INK});
window.__ready=true;
})();
</script></body></html>
